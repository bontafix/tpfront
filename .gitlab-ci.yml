# .gitlab-ci.yml
stages:
  - deploy

variables:
  GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"

# Деплой на DEV
deploy_dev:
  stage: deploy
  tags:
    - front
  only:
    - dev
  before_script:
    - node --version
    - npm --version
  script:
    - echo "📦 Установка зависимостей..."
    - npm ci
    - echo "🔨 Сборка проекта..."
    - npm run build
    - echo "✅ Сборка завершена успешно"
    - echo "🚀 Деплой на DEV сервер ..."
    - echo "📂 Копирование файлов в /var/www/dev-teacherplanner ..."
    - mkdir -p /var/www/dev-teacherplanner/
    - rsync -rlDv --delete dist/ /var/www/dev-teacherplanner/
    - echo "✅ Деплой на DEV завершен успешно"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  environment:
    name: development
    url: https://dev-teacherplanner.ru

# Деплой на PROD
deploy_prod:
  stage: deploy
  tags:
    - front
  only:
    - main
  before_script:
    - node --version
    - npm --version
    - whoami
    - pwd
    - ls -la
  script:
    - echo "📦 Установка зависимостей..."
    - npm ci
    - echo "🔨 Сборка проекта..."
    - npm run build
    - echo "✅ Сборка завершена успешно"
    - echo "Содержимое dist/:"
    - ls -la dist/
    - echo "🚀 Деплой на PROD сервер..."
    - echo "Проверка SSH подключения..."
    - ssh teacherplanner-prod "whoami && ls -la /var/www/teacher-planner/"
    - echo "Копирование файлов..."
    - rsync -rlDv --delete dist/ teacherplanner-prod:/var/www/teacher-planner/
    - echo "Проверка результата на сервере..."
    - ssh teacherplanner-prod "ls -la /var/www/teacher-planner/"
    - echo "✅ Деплой на PROD завершен успешно"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  environment:
    name: production
    url: https://teacherplanner.ru