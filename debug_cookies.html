<!DOCTYPE html>
<html>
<head>
    <title>Проверка Cookies</title>
</head>
<body>
    <h1>Проверка Cookies для /alex/</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += msg + '<br>';
            console.log(msg);
        }
        
        log('<h2>1. Текущая информация</h2>');
        log('URL: ' + window.location.href);
        log('Pathname: ' + window.location.pathname);
        log('');
        
        log('<h2>2. Все cookies</h2>');
        log('document.cookie: ' + document.cookie);
        log('');
        
        log('<h2>3. Попытка установить тестовую cookie с разными path</h2>');
        
        // Тест 1: path=/
        document.cookie = 'test_root=value1; path=/; max-age=3600';
        log('✅ Установлена cookie с path=/');
        
        // Тест 2: path=/alex
        document.cookie = 'test_alex=value2; path=/alex; max-age=3600';
        log('✅ Установлена cookie с path=/alex');
        
        // Тест 3: path=/alex/
        document.cookie = 'test_alex_slash=value3; path=/alex/; max-age=3600';
        log('✅ Установлена cookie с path=/alex/');
        
        log('');
        log('<h2>4. Проверка установленных cookies</h2>');
        log('document.cookie: ' + document.cookie);
        
        setTimeout(() => {
            log('');
            log('<h2>5. Проверка через 100ms</h2>');
            log('document.cookie: ' + document.cookie);
            
            const cookies = document.cookie.split(';').map(c => c.trim());
            cookies.forEach(cookie => {
                log('  - ' + cookie);
            });
        }, 100);
    </script>
</body>
</html>
